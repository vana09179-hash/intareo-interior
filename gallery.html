<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея — Intareo</title>
<meta name="description" content="Галерея інтер'єрів студії Intareo: вітальні, кухні, спальні, ванні кімнати та екстер'єри.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">
<div id="header"></div>

<main>
  <section class="page-hero">
    <span class="bignum" aria-hidden="true">03</span>
    <div class="glow" aria-hidden="true"></div>
    <div class="container">
      <div class="crumbs"><a href="index.html">Головна</a> / Галерея</div>
      <h1><small>Наші</small>Інтер'єри</h1>
      <p>Добірка реалізованих просторів. Оберіть категорію та натисніть на фото, щоб переглянути його на весь екран.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="filters">
        <button class="chip active" data-f="all">Усі</button>
        <button class="chip" data-f="living">Вітальні</button>
        <button class="chip" data-f="kitchen">Кухні</button>
        <button class="chip" data-f="bedroom">Спальні</button>
        <button class="chip" data-f="bath">Ванні</button>
        <button class="chip" data-f="exterior">Екстер'єр</button>
      </div>
      <div class="masonry" id="gallery"></div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Перегляд фото">
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-btn lb-close" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
  <button class="lb-btn lb-prev" aria-label="Попереднє"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lb-btn lb-next" aria-label="Наступне"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 5 7 7-7 7"/></svg></button>
</div>

<div id="footer"></div>
<script src="js/main.js"></script>
</body>
</html>
